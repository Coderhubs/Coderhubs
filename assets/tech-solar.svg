<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sun" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="24" fill="#0F172A"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Tech Stack</text>

  <!-- Orbits -->
  <g fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6">
    <circle cx="400" cy="400" r="110"/>
    <circle cx="400" cy="400" r="180"/>
    <circle cx="400" cy="400" r="250"/>
    <circle cx="400" cy="400" r="320"/>
  </g>

  <!-- Sun (Coderhubs) -->
  <circle cx="400" cy="400" r="60" fill="url(#sun)"/>
  <text x="400" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Coderhubs</text>
  <text x="400" y="414" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0F172A">Dev</text>

  <!-- Ring 1: Languages (sky) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle" dominant-baseline="middle">
    <circle cx="400" cy="290" r="36" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="400" y="290">Python</text>
    <circle cx="495" cy="455" r="36" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="495" y="455">TypeScript</text>
    <circle cx="305" cy="455" r="36" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="305" y="455">HTML5</text>
  </g>

  <!-- Ring 2: Frontend (teal) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle" dominant-baseline="middle">
    <circle cx="580" cy="400" r="36" fill="#0F172A" stroke="#14B8A6" stroke-width="2"/>
    <text x="580" y="400">Next.js</text>
    <circle cx="220" cy="400" r="36" fill="#0F172A" stroke="#14B8A6" stroke-width="2"/>
    <text x="220" y="400">Tailwind</text>
  </g>

  <!-- Ring 3: Backend and AI (violet) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle" dominant-baseline="middle">
    <circle cx="400" cy="150" r="36" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <text x="400" y="150">FastAPI</text>
    <circle cx="616" cy="525" r="36" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <text x="616" y="525">Chainlit</text>
    <circle cx="184" cy="525" r="36" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <text x="184" y="525">Streamlit</text>
  </g>

  <!-- Ring 4: Deployment (amber) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle" dominant-baseline="middle">
    <circle cx="720" cy="400" r="36" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <text x="720" y="400">Vercel</text>
    <circle cx="80" cy="400" r="36" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <text x="80" y="400">Render</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8" dominant-baseline="middle">
    <circle cx="170" cy="760" r="6" fill="#38BDF8"/>
    <text x="184" y="760">Languages</text>
    <circle cx="330" cy="760" r="6" fill="#14B8A6"/>
    <text x="344" y="760">Frontend</text>
    <circle cx="490" cy="760" r="6" fill="#A78BFA"/>
    <text x="504" y="760">Backend &amp; AI</text>
    <circle cx="650" cy="760" r="6" fill="#F59E0B"/>
    <text x="664" y="760">Deployment</text>
  </g>
</svg>
